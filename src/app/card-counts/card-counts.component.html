<div *ngIf="challenges"
  class="relative flex flex-col min-w-0 break-words bg-white rounded mb-6 xl:mb-0 shadow-lg card-counts">
  <div class="flex-auto p-4">
    <div class="flex flex-wrap">
      <div class="relative w-full pr-4 max-w-full flex-grow flex-1 align-center">
        <h5 class="uppercase font-bold  set-count-text">
          Upcoming Challenges
        </h5>
        <span class="font-semibold set-counts">
          {{ challenges.length }}
        </span>
      </div>

    </div>
  </div>
</div>

<div *ngIf="upcomingEvent"
  class="relative flex flex-col min-w-0 break-words bg-white rounded mb-6 xl:mb-0 shadow-lg card-counts">
  <div class="flex-auto p-4">
    <div class="flex flex-wrap">
      <div class="relative w-full pr-4 max-w-full flex-grow flex-1 align-center">
        <h5 class="uppercase font-bold set-count-text">
          Upcoming Matches
        </h5>
        <span class="font-semibold set-counts">
          {{ upcomingEvent.length }}
        </span>
      </div>

    </div>
  </div>
</div>

<div *ngIf="upcomingFriendly"
  class="relative flex flex-col min-w-0 break-words bg-white rounded mb-6 xl:mb-0 shadow-lg card-counts">
  <div class="flex-auto p-4">
    <div class="flex flex-wrap">
      <div class="relative w-full pr-4 max-w-full flex-grow flex-1 align-center">
        <h5 class="uppercase font-bold  set-count-text">
          Upcoming Friendly
        </h5>
        <span class="font-semibold set-counts">
          {{ upcomingFriendly.length }}
        </span>
      </div>

    </div>
  </div>
</div>

<div *ngIf="teamData"
  class="relative flex flex-col min-w-0 break-words bg-white rounded mb-6 xl:mb-0 shadow-lg card-counts">
  <div class="flex-auto p-2" *ngIf="teamData.length > 0">
    <button (click)="updateTeam(teamData[0])"
      class="card-button btn-set bg-indigo-500 text-white active:bg-indigo-600 font-bold uppercase px-2 rounded outline-none focus:outline-none mr-1 mb-1 ease-linear transition-all duration-150"
      type="button">
      <mat-icon class="edit-icon">edit</mat-icon>
    </button>
    <div class="flex flex-wrap">
      <div class="relative w-full max-w-full flex-grow flex-1 align-center">
        <div class="row m-0">
          <div class="col-12">
            <img class="mb-2 grp_image"
              *ngIf="teamData[0]?.grp_image == '' || teamData[0]?.grp_image == null || !teamData[0]?.grp_image.includes('http')"
              src="../../../assets/images/Gender.png">
            <img class="mb-2 grp_image"
              *ngIf="teamData[0]?.grp_image != '' &&  teamData[0]?.grp_image != null && teamData[0]?.grp_image.includes('http')"
              src="{{teamData[0]?.grp_image}}">
          </div>
          <div class="col-12">
            <p class="grp_name">
              {{teamData[0].grp_name}}</p>
            <p class="grp_about">{{teamData[0].grp_about}}</p>
          </div>

        </div>
      </div>
    </div>
  </div>
  <div class="flex-auto p-2" *ngIf="teamData.length == 0">
    <div class="flex flex-wrap">
      <div class="relative w-full max-w-full flex-grow flex-1 align-center">

        <div class="row m-0">
          <div class="col-12">
            <button (click)="goToCreateTeam()"
              class="color-0e3508 btn-set bg-indigo-500 text-white active:bg-indigo-600 font-bold uppercase px-2 rounded outline-none focus:outline-none mr-1 mb-1 ease-linear transition-all duration-150"
              type="button">
              <mat-icon class="edit-icon">add_box</mat-icon>
            </button>
          </div>
          <div class="col-12">
            <p class="team">
              CREATE TEAM</p>

          </div>

        </div>
      </div>
    </div>
  </div>
</div>
