<div class="container-fluid page">
  <div class="d-flex page__box pt-2 pl-3 pr-3 pb-3 mt-2 min-height-wallet min-height-100">
    <div class="row width-size">
      <div class="col-md-6 h-60">
        <label *ngIf="!update" class="bg-trans line-h">
          <mat-icon class="title-icon">emoji_events</mat-icon>
          Create Challenge
        </label>
        <label *ngIf="update" class="bg-trans line-h">
          <mat-icon class="title-icon">edit_note</mat-icon>
          Update Challenge
        </label>
      </div>
    </div>
  </div>

  <div class="page__content p-2 position-relative min-h-calc-110">
    <div class="flex flex-wrap mt-2">
      <div class="container text-center text-lg-start set-margin-zero">
        <div class="row gx-lg-5 align-items-center">
          <div class="col-lg-8 mb-5 mb-lg-0 position-relative m-0-auto">
            <div class="card bg-glass card-box-shadow challenge-card">
              <div class="card-body">
                <form [formGroup]="createChallengeFormgroup">

                  <!-- Sport -->
                  <div class="form-group align-left mb-3 field-row">
                    <div class="field-icon field-icon--sport">
                      <mat-icon>sports_soccer</mat-icon>
                    </div>
                    <div class="field-input-wrap">
                      <select class="form-select" name="sport" id="floatingSelectGrid"
                        aria-label="Floating label select example" formControlName="sport">
                        <option value="">Select</option>
                        <option *ngFor="let sport of mSportsResponse.data" value="{{sport.id}}">{{sport.sport_name}}
                        </option>
                      </select>
                      <label class="form-control-placeholder" for="floatingSelectGrid">Select Sport</label>
                    </div>
                  </div>

                  <!-- Venue -->
                  <div class="form-group align-left mb-3 field-row">
                    <div class="field-icon field-icon--venue">
                      <mat-icon>place</mat-icon>
                    </div>
                    <div class="field-input-wrap">
                      <input type="submit" id="venue" class="form-control align-left" name="venue"
                        formControlName="venue" required (click)="getVenueList(content)">
                      <label class="form-control-placeholder" for="venue">Select Venue</label>
                    </div>
                  </div>

                  <!-- Title -->
                  <div class="form-group align-left mb-3 field-row">
                    <div class="field-icon field-icon--title">
                      <mat-icon>title</mat-icon>
                    </div>
                    <div class="field-input-wrap">
                      <input type="text" id="title" class="form-control" name="title" formControlName="title"
                        required>
                      <label class="form-control-placeholder" for="title">Challenge Title</label>
                    </div>
                  </div>

                  <!-- Date -->
                  <div class="form-group align-left mb-3 field-row">
                    <div class="field-icon field-icon--date">
                      <mat-icon>event</mat-icon>
                    </div>
                    <div class="field-input-wrap">
                      <input type="datetime-local" id="date" class="form-control" name="date" formControlName="date"
                        required (input)="selectDate($event.target.value)">
                    </div>
                  </div>

                  <!-- Description -->
                  <div class="form-group mb4 align-left field-row field-row--textarea">
                    <div class="field-icon field-icon--desc">
                      <mat-icon>notes</mat-icon>
                    </div>
                    <div class="field-input-wrap">
                      <textarea style="height: 100px;" type="text" id="description" name="description"
                        class="form-control mt-2" formControlName="description" required></textarea>
                      <label class="form-control-placeholder" for="description">Challenge Description</label>
                    </div>
                  </div>

                  <!-- Team -->
                  <div class="form-group align-left mb-3 field-row">
                    <div class="field-icon field-icon--team">
                      <mat-icon>groups</mat-icon>
                    </div>
                    <div class="field-input-wrap">
                      <input type="submit" id="team" class="form-control align-left" name="team"
                        formControlName="team" required (click)="getTeamList(content)">
                      <label class="form-control-placeholder" for="team">Select Team</label>
                    </div>
                  </div>

                  <!-- Referee -->
                  <div class="form-group align-left mb-3 field-row">
                    <div class="field-icon field-icon--refree">
                      <mat-icon>sports</mat-icon>
                    </div>
                    <div class="field-input-wrap">
                      <input type="submit" id="refree" class="form-control align-left" name="refree"
                        formControlName="refree" required (click)="getRefreeList(content)">
                      <label class="form-control-placeholder" for="refree">Select Refree</label>
                    </div>
                  </div>

                  <div class="submit-row">
                    <button *ngIf="!update" type="submit"
                      class="btn btn-success btn-block btn-fonts box-shad update-btn" (click)="createNewChallenge()">
                      <mat-icon class="btn-icon">emoji_events</mat-icon>
                      Create Challenge
                    </button>
                    <button *ngIf="update" type="submit" class="btn btn-success btn-block btn-fonts box-shad update-btn"
                      (click)="updateChallenge()">
                      <mat-icon class="btn-icon">save</mat-icon>
                      Update Challenge
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<app-modaldialog *ngIf="loaderShow"></app-modaldialog>

<ng-template #content let-modal data-backdrop="false">

  <!-- VENUE PICKER -->
  <div *ngIf="createChallengeVenue">
    <div class="modal-header modal-header--themed">
      <h4 class="modal-title" id="modal-basic-title">
        <mat-icon class="modal-title-icon">place</mat-icon> Venue
      </h4>
      <button class="btn-set icon-done-btn" type="button" (click)="saveVenue()">
        <mat-icon>done</mat-icon>
      </button>
    </div>
    <div class="modal-body p-1 friendlyshow">
      <div class="search-wrap">
        <mat-icon class="search-icon">search</mat-icon>
        <input class="form-control mr-sm-2 search-input" type="text" placeholder="Search" aria-label="Search"
          (input)=" searchVenue($event)">
      </div>

      <div *ngIf="!searchtoggle" class="pt-3">
        <div *ngFor="let venue of mListVenueResponse.data; let i=index" class="col-xl-12 col-sm-12 mb-3"
          (click)="selectVenue(venue)">
          <div class="rounded py-3 px-3 align-center box-shad venueData"
            [ngStyle]="{'border': mCreateChallengeRequest.c_location_id != venue.id ? 'none' : '2px solid #058749','background-color': mCreateChallengeRequest.c_location_id != venue.id ? '#fff' : '#a5d6a7'}">
            <label class="width-size align-left bg-trans font-600">{{venue.name}}</label><br>
            <label class="width-size align-left bg-trans">{{venue.description}}</label><br>
            <label class="width-size align-right bg-trans">€ {{venue.price}}</label><br>
            <button [hidden]="mCreateChallengeRequest.c_location_id != venue.id"
              class="venueId btn-set icon-done-btn"
              type="button" (click)="modal.dismiss('Cross click')">
              <mat-icon class="venueSave">done_outline</mat-icon>
            </button>
          </div>
        </div>
      </div>

      <div *ngIf="searchtoggle" class="pt-3">
        <div *ngFor="let venue of searchVenueList; let i=index" class="col-xl-12 col-sm-12 mb-3"
          (click)="selectVenue(venue)">
          <div class="rounded py-3 px-3 align-center box-shad venueData"
            [ngStyle]="{'border': mCreateChallengeRequest.c_location_id != venue.id ? 'none' : '2px solid #058749','background-color': mCreateChallengeRequest.c_location_id != venue.id ? '#fff' : '#a5d6a7'}">
            <label class="width-size align-left bg-trans font-600">{{venue.name}}</label><br>
            <label class="width-size align-left bg-trans">{{venue.description}}</label><br>
            <label class="width-size align-right bg-trans">€ {{venue.price}}</label><br>
            <button [hidden]="mCreateChallengeRequest.c_location_id != venue.id"
              class="venueId btn-set icon-done-btn"
              type="button">
              <mat-icon class="venueSave">done_outline</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- TEAM PICKER -->
  <div *ngIf="createChallengeTeam">
    <div class="modal-header modal-header--themed">
      <h4 class="modal-title" id="modal-basic-title">
        <mat-icon class="modal-title-icon">groups</mat-icon> Team
      </h4>
      <button class="btn-set icon-done-btn" type="button" (click)="saveTeam()">
        <mat-icon>done</mat-icon>
      </button>
    </div>
    <div class="modal-body p-1 friendlyshow">
      <div class="search-wrap">
        <mat-icon class="search-icon">search</mat-icon>
        <input class="form-control mr-sm-2 search-input" type="text" placeholder="Search" aria-label="Search"
          (input)="searchTeam($event)">
      </div>

      <div *ngIf="!searchtoggle" class="pt-3">
        <div *ngFor="let team of mListGroupResponse.data; let i=index" class="col-xl-12 col-sm-12 mb-3"
          (click)="selectTeam(team)">
          <div class="rounded py-3 px-3 align-center box-shad venueData"
            [ngStyle]="{'border': !teamId.includes(','+team.id+',') ? 'none' : '2px solid #058749','background-color': !teamId.includes(','+team.id+',') ? '#fff' : '#a5d6a7'}">
            <label class="width-size align-left bg-trans font-600">{{team.grp_name}}</label><br>
            <label class="width-size align-left bg-trans">{{team.grp_about}}</label><br>
            <button [hidden]="!teamId.includes(','+team.id+',')"
              class="venueId btn-set icon-done-btn"
              type="button">
              <mat-icon class="venueSave">done_outline</mat-icon>
            </button>
          </div>
        </div>
      </div>

      <div *ngIf="searchtoggle" class="pt-3">
        <div *ngFor="let team of searchTeamList; let i=index" class="col-xl-12 col-sm-12 mb-3"
          (click)="selectTeam(team)">
          <div class="rounded py-3 px-3 align-center box-shad venueData"
            [ngStyle]="{'border': !teamId.includes(','+team.id+',') ? 'none' : '2px solid #058749','background-color': !teamId.includes(','+team.id+',') ? '#fff' : '#a5d6a7'}">
            <label class="width-size align-left bg-trans font-600">{{team.grp_name}}</label><br>
            <label class="width-size align-left bg-trans">{{team.grp_about}}</label><br>
            <button [hidden]="!teamId.includes(','+team.id+',')"
              class="venueId btn-set icon-done-btn"
              type="button">
              <mat-icon class="venueSave">done_outline</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- REFEREE PICKER -->
  <div *ngIf="createChallengeRefree">
    <div class="modal-header modal-header--themed">
      <h4 class="modal-title" id="modal-basic-title">
        <mat-icon class="modal-title-icon">sports</mat-icon> Refree
      </h4>
      <button class="btn-set icon-done-btn" type="button" (click)="saveRefree()">
        <mat-icon>done</mat-icon>
      </button>
    </div>
    <div class="modal-body p-1 friendlyshow">
      <div class="search-wrap">
        <mat-icon class="search-icon">search</mat-icon>
        <input class="form-control mr-sm-2 search-input" type="text" placeholder="Search" aria-label="Search"
          (input)="searchRefree($event)">
      </div>

      <div *ngIf="!searchtoggle" class="pt-3">
        <div *ngFor="let refree of mListRefreeResponse.data; let i=index"
          class="col-xl-12 col-sm-12 mb-3 box-shad refreeSelect" (click)="selectRefree(refree)">
          <div class="row set-row b-radius-8"
            [ngStyle]="{'border': !refreeId.includes(','+refree.id+',') ? 'none' : '2px solid #058749','background-color': !refreeId.includes(','+refree.id+',') ? '#fff' : '#a5d6a7'}">
            <div class="col-4 align-center">
              <img *ngIf="refree?.profile_image == null || refree?.profile_image == ''"
                class="event-image-set refree-img" src="../../../assets/images/Gender.png">
              <img *ngIf="refree?.profile_image != null && refree?.profile_image != ''"
                class="event-image-set refree-img" src="{{refree?.profile_image}}">
            </div>
            <div class="col-8 refree-name">
              <label class="name align-left bg-trans">{{refree?.fname}}
                {{refree?.lname}}</label>
              <button [hidden]="!refreeId.includes(','+refree.id+',')"
                class="venueId btn-set icon-done-btn"
                type="button">
                <mat-icon class="venueSave">done_outline</mat-icon>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="searchtoggle" class="pt-3">
        <div *ngFor="let refree of searchRefreeList; let i=index" class="col-xl-12 col-sm-12 mb-3 box-shad refreeSelect"
          (click)="selectRefree(refree)">
          <div class="row set-row b-radius-8"
            [ngStyle]="{'border': !refreeId.includes(','+refree.id+',') ? 'none' : '2px solid #058749','background-color': !refreeId.includes(','+refree.id+',') ? '#fff' : '#a5d6a7'}">
            <div class="col-4 align-center">
              <img *ngIf="refree?.profile_image == null || refree?.profile_image == ''"
                class="event-image-set refree-img" src="../../../assets/images/Gender.png">
              <img *ngIf="refree?.profile_image != null && refree?.profile_image != ''"
                class="event-image-set refree-img" src="{{refree?.profile_image}}">
            </div>
            <div class="col-8 refree-name">
              <label class="name align-left bg-trans">{{refree?.fname}}
                {{refree?.lname}}</label>
              <button [hidden]="!refreeId.includes(','+refree.id+',')"
                class="venueId btn-set icon-done-btn"
                type="button">
                <mat-icon class="venueSave">done_outline</mat-icon>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
