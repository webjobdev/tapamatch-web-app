<div class="container-fluid page">
  <div class="d-flex page__box pt-2 pl-3 pr-3 pb-3 mt-2 min-height-wallet min-height-100">
    <div class="row width-size">
      <div class="col-md-6 h-60">
        <label *ngIf="!update" class="bg-trans line-h">Create Friendly</label>
        <label *ngIf="update" class="bg-trans line-h">Update Friendly</label>
      </div>
    </div>

  </div>
  <div class="page__content p-2 position-relative min-h-calc-110">
    <div class="flex flex-wrap mt-2">
      <div class="container text-center text-lg-start set-margin-zero">
        <div class="row gx-lg-5 align-items-center">
          <div class="col-lg-8 mb-5 mb-lg-0 position-relative m-0-auto">
            <div class="card bg-glass card-box-shadow">
              <div class="card-body">
                <form [formGroup]="createFriendlyFormgroup">

                  <div class="form-group align-left mb-3">
                    <select class="form-select" name="sport" id="floatingSelectGrid"
                      aria-label="Floating label select example" formControlName="sport">
                      <option value="">Select</option>
                      <option *ngFor="let sport of mSportsResponse.data" value="{{sport.id}}">{{sport.sport_name}}
                      </option>
                    </select>
                    <label class="form-control-placeholder" for="floatingSelectGrid">Select Sport</label>
                  </div>
                  <div class="form-group  align-left mb-3">
                    <input type="submit" id="venue" class="form-control align-left" name="venue" formControlName="venue"
                      required (click)="getVenueList(content)">
                    <label class="form-control-placeholder" for="venue">Select Venue</label>
                  </div>
                  <div class="form-group  align-left mb-3">
                    <input type="text" id="title" class="form-control" name="title" formControlName="title" required>
                    <label class="form-control-placeholder" for="title">Friendly Title</label>
                  </div>
                  <div class="form-group  align-left mb-3">
                    <input type="datetime-local" id="date" class="form-control" name="date" formControlName="date"
                      required (input)="selectDate($event.target.value)">
                  </div>
                  <div class="form-group mb4 align-left">
                    <textarea style="
              height: 100px;" type="text" id="description" name="description" class="form-control mt-2"
                      formControlName="description" required></textarea>
                    <label class="form-control-placeholder" for="description">Friendly Description</label>
                  </div>
                  <div class="form-group  align-left mb-3">
                    <input type="submit" id="friend" class="form-control align-left" name="friend"
                      formControlName="friend" required (click)="getFriendList(content)">
                    <label class="form-control-placeholder" for="friend">Select User</label>
                  </div>
                  <div class="form-group  align-left mb-3">
                    <input type="submit" id="refree" class="form-control align-left" name="refree"
                      formControlName="refree" required (click)="getRefreeList(content)">
                    <label class="form-control-placeholder" for="refree">Select Refree</label>
                  </div>
                  <div>
                    <button *ngIf="!update" type="submit"
                      class="btn btn-success btn-block btn-fonts box-shad update-btn" (click)="createNewFriendly()">
                      Create Friendly
                    </button>
                    <button *ngIf="update" type="submit" class="btn btn-success btn-block btn-fonts box-shad update-btn"
                      (click)="updateFriendly()">
                      Update Friendly
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<app-modaldialog *ngIf="loaderShow"></app-modaldialog>
<ng-template #content let-modal data-backdrop="false">
  <div *ngIf="createFriendlyVenue">
    <div class="modal-header">
      <h4 class="modal-title" id="modal-basic-title">Venue</h4>
      <button
        class="btn-set bg-indigo-500 text-white active:bg-indigo-600 font-bold uppercase px-2 py-1 rounded outline-none focus:outline-none mr-1 mb-1 ease-linear transition-all duration-150"
        type="button" (click)="saveVenue()">
        <mat-icon>done</mat-icon>
      </button>
    </div>
    <div class="modal-body p-1 friendlyshow">
      <input class="form-control mr-sm-2" type="text" placeholder="Search" aria-label="Search"
        (input)=" searchVenue($event)">
      <div *ngIf="!searchtoggle" class="pt-3">
        <div *ngFor="let venue of mListVenueResponse.data; let i=index" class="col-xl-12 col-sm-12 mb-3"
          (click)="selectVenue(venue)">
          <div class="rounded py-3 px-3 align-center box-shad venueData"
            [ngStyle]="{'border': mCreateFriendlyRequest.frd_location_id != venue.id ? 'none' : '2px solid #0c3007','background-color': mCreateFriendlyRequest.frd_location_id != venue.id ? '#fff' : '#e9a927'}">
            <label class="width-size align-left bg-trans font-600">{{venue.name}}</label><br>
            <label class="width-size align-left bg-trans">{{venue.description}}</label><br>
            <label class="width-size align-right bg-trans">€ {{venue.price}}</label><br>
            <button [hidden]="mCreateFriendlyRequest.frd_location_id != venue.id"
              class=" venueId btn-set bg-indigo-500 text-white active:bg-indigo-600 font-bold uppercase px-2 py-1 rounded outline-none focus:outline-none mr-1 mb-1 ease-linear transition-all duration-150"
              type="button" (click)="modal.dismiss('Cross click')">
              <mat-icon class="venueSave">done_outline</mat-icon>
            </button>
          </div>
        </div>
      </div>
      <div *ngIf="searchtoggle" class="pt-3">
        <div *ngFor="let venue of searchVenueList; let i=index" class="col-xl-12 col-sm-12 mb-3"
          (click)="selectVenue(venue)">
          <div class=" rounded py-3 px-3 align-center box-shad venueData"
            [ngStyle]="{'border': mCreateFriendlyRequest.frd_location_id != venue.id ? 'none' : '2px solid #0c3007','background-color': mCreateFriendlyRequest.frd_location_id != venue.id ? '#fff' : '#e9a927'}">
            <label class="width-size align-left bg-trans font-600">{{venue.name}}</label><br>
            <label class="width-size align-left bg-trans">{{venue.description}}</label><br>
            <label class="width-size align-right bg-trans">€ {{venue.price}}</label><br>
            <button [hidden]="mCreateFriendlyRequest.frd_location_id != venue.id"
              class="venueId btn-set bg-indigo-500 text-white active:bg-indigo-600 font-bold uppercase px-2 py-1 rounded outline-none focus:outline-none mr-1 mb-1 ease-linear transition-all duration-150"
              type="button">
              <mat-icon class="venueSave">done_outline</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="createFriendlyUser">
    <div class="modal-header">
      <h4 class="modal-title" id="modal-basic-title">Friends</h4>
      <button
        class="btn-set bg-indigo-500 text-white active:bg-indigo-600 font-bold uppercase px-2 py-1 rounded outline-none focus:outline-none mr-1 mb-1 ease-linear transition-all duration-150"
        type="button" (click)="saveFriend()">
        <mat-icon>done</mat-icon>
      </button>
    </div>
    <div class="modal-body p-1 friendlyshow">
      <input class="form-control mr-sm-2" type="text" placeholder="Search" aria-label="Search"
        (input)="searchFriend($event)">
      <div *ngIf="!searchtoggle" class="pt-3">
        <div *ngFor="let friend of mFriendListResponse.data; let i=index" class="col-xl-12 col-sm-12 mb-3"
          (click)="selectFriend(friend)">
          <div class="rounded py-3 px-3 align-center box-shad venueData"
            [ngStyle]="{'border': !friendId.includes(','+friend.user.id+',') ? 'none' : '2px solid #0c3007','background-color': !friendId.includes(','+friend.user.id+',') ? '#fff' : '#e9a927'}">
            <label class="width-size align-left bg-trans font-600">{{friend?.user?.fname}}
              {{friend?.user?.lname}}</label><br>
            <label class="width-size align-left bg-trans">{{friend?.user?.banner_description}}</label><br>
            <button [hidden]="!friendId.includes(','+friend.user.id+',')"
              class="venueId btn-set bg-indigo-500 text-white active:bg-indigo-600 font-bold uppercase px-2 py-1 rounded outline-none focus:outline-none mr-1 mb-1 ease-linear transition-all duration-150"
              type="button">
              <mat-icon class="venueSave">done_outline</mat-icon>
            </button>
          </div>
        </div>
      </div>
      <div *ngIf="searchtoggle" class="pt-3">
        <div *ngFor="let friend of searchFriendList; let i=index" class="col-xl-12 col-sm-12 mb-3"
          (click)="selectFriend(friend)">
          <div class="rounded py-3 px-3 align-center box-shad venueData"
            [ngStyle]="{'border': !friendId.includes(','+friend.user.id+',') ? 'none' : '2px solid #0c3007','background-color': !friendId.includes(','+friend.user.id+',') ? '#fff' : '#e9a927'}">
            <label class="width-size align-left bg-trans font-600">{{friend?.user?.fname}}
              {{friend?.user?.lname}}</label><br>
            <label class="width-size align-left bg-trans">{{friend?.user?.banner_description}}</label><br>
            <button [hidden]="!friendId.includes(','+friend.user.id+',')"
              class="venueId btn-set bg-indigo-500 text-white active:bg-indigo-600 font-bold uppercase px-2 py-1 rounded outline-none focus:outline-none mr-1 mb-1 ease-linear transition-all duration-150"
              type="button">
              <mat-icon class="venueSave">done_outline</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="createFriendlyRefree">
    <div class="modal-header">
      <h4 class="modal-title" id="modal-basic-title">Refree</h4>
      <button
        class="btn-set bg-indigo-500 text-white active:bg-indigo-600 font-bold uppercase px-2 py-1 rounded outline-none focus:outline-none mr-1 mb-1 ease-linear transition-all duration-150"
        type="button" (click)="saveRefree()">
        <mat-icon>done</mat-icon>
      </button>
    </div>
    <div class="modal-body p-1 friendlyshow">
      <input class="form-control mr-sm-2" type="text" placeholder="Search" aria-label="Search"
        (input)="searchRefree($event)">
      <div *ngIf="!searchtoggle" class="pt-3">
        <div *ngFor="let refree of mListRefreeResponse.data; let i=index"
          class="refreeSelect col-xl-12 col-sm-12 mb-3 box-shad" (click)="selectRefree(refree)">
          <div class="row set-row b-radius-8"
            [ngStyle]="{'border': !refreeId.includes(','+refree.id+',') ? 'none' : '2px solid #0c3007','background-color': !refreeId.includes(','+refree.id+',') ? '#fff' : '#e9a927'}">
            <div class="col-4 align-center">
              <img *ngIf="refree?.profile_image == null || refree?.profile_image == ''"
                class="event-image-set refree-img" src="../../../assets/images/Gender.png">
              <img *ngIf="refree?.profile_image != null && refree?.profile_image != ''"
                class="event-image-set refree-img" src="{{refree?.profile_image}}">
            </div>
            <div class="col-8 refree-name">
              <label class="name align-left bg-trans">{{refree?.fname}}
                {{refree?.lname}}</label>
              <button [hidden]="!refreeId.includes(','+refree.id+',')"
                class="venueId btn-set bg-indigo-500 text-white active:bg-indigo-600 font-bold uppercase px-2 py-1 rounded outline-none focus:outline-none mr-1 mb-1 ease-linear transition-all duration-150"
                type="button">
                <mat-icon class="venueSave">done_outline</mat-icon>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div *ngIf="searchtoggle" class="pt-3">
        <div *ngFor="let refree of searchRefreeList; let i=index"
          class=" refreeSelect col-xl-12 col-sm-12 mb-3 box-shad" (click)="selectRefree(refree)">
          <div class="row set-row b-radius-8"
            [ngStyle]="{'border': !refreeId.includes(','+refree.id+',') ? 'none' : '2px solid #0c3007','background-color': !refreeId.includes(','+refree.id+',') ? '#fff' : '#e9a927'}">
            <div class="col-4 align-center">
              <img *ngIf="refree?.profile_image == null || refree?.profile_image == ''"
                class="event-image-set refree-img" src="../../../assets/images/Gender.png">
              <img *ngIf="refree?.profile_image != null && refree?.profile_image != ''"
                class="event-image-set refree-img" src="{{refree?.profile_image}}">
            </div>
            <div class="col-8 refree-name">
              <label class="name align-left bg-trans">{{refree?.fname}}
                {{refree?.lname}}</label>
              <button [hidden]="!refreeId.includes(','+refree.id+',')"
                class="venueId btn-set bg-indigo-500 text-white active:bg-indigo-600 font-bold uppercase px-2 py-1 rounded outline-none focus:outline-none mr-1 mb-1 ease-linear transition-all duration-150"
                type="button">
                <mat-icon class="venueSave">done_outline</mat-icon>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
